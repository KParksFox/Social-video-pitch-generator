<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Social Video Pitch Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; line-height: 1.5; color: #333; }
        h2 { margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 10px; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; }
        .clip-card { background: #f9f9fb; border: 1px solid #e1e1e8; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
        .clip-header { font-weight: bold; font-size: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block; }
        .btn-primary { background: #0066cc; color: white; }
        .btn-primary:hover { background: #0052a3; }
        .btn-secondary { background: #e0e0e0; color: #333; margin-top: 10px; }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-danger { background: #dc3545; color: white; padding: 4px 8px; font-size: 12px; }
        .btn-copy { background: #28a745; color: white; width: 100%; margin-top: 10px; font-size: 16px; padding: 12px; }
        .btn-copy:hover { background: #218838; }
        #output { margin-top: 15px; background: #282c34; color: #abb2bf; padding: 15px; border-radius: 6px; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <h2>Social Video Email Pitch Generator</h2>

    <label for="introText">Opening Text:</label>
    <input type="text" id="introText" value="Sending over the following original video clips for social use.">

    <div id="clipsContainer" style="margin-top: 20px;">
        <!-- Dynamic clips will be injected here -->
    </div>

    <button type="button" class="btn btn-secondary" onclick="addClip()">+ Add Another Clip</button>

    <div style="margin-top: 25px;">
        <button type="button" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 16px;" onclick="generateEmail()">Generate Draft</button>
    </div>

    <div id="outputSection" style="display:none; margin-top: 30px;">
        <h3>Your Formatted Email:</h3>
        <div id="output"></div>
        <button class="btn btn-copy" onclick="copyToClipboard()">Copy Email to Clipboard</button>
    </div>

    <script>
        let clipCount = 0;

        // Automatically add one initial clip on load
        window.onload = function() {
            addClip();
        };

        function addClip() {
            clipCount++;
            const container = document.getElementById('clipsContainer');
            const clipDiv = document.createElement('div');
            clipDiv.className = 'clip-card';
            clipDiv.id = `clip-${clipCount}`;

            clipDiv.innerHTML = `
                <div class="clip-header">
                    <span>Clip <span class="clip-number"></span></span>
                    <button type="button" class="btn btn-danger" onclick="removeClip(${clipCount})">Remove</button>
                </div>
                <label>Clip Summary / Description:</label>
                <textarea class="clip-desc" rows="2" placeholder="e.g., Clip features Marissa Streit talking about..."></textarea>
                
                <label>Social Box Link:</label>
                <input type="url" class="clip-url" placeholder="https://app.box.com/s/...">

                <label>Headline (HED):</label>
                <input type="text" class="clip-hed" placeholder="Enter headline">

                <label>Deck (DEK):</label>
                <textarea class="clip-dek" rows="2" placeholder="Enter dek"></textarea>
            `;

            container.appendChild(clipDiv);
            updateClipNumbers();
        }

        function removeClip(id) {
            const clipToRemove = document.getElementById(`clip-${id}`);
            if (clipToRemove) {
                clipToRemove.remove();
                updateClipNumbers();
            }
        }

        function updateClipNumbers() {
            const cards = document.querySelectorAll('.clip-card');
            cards.forEach((card, index) => {
                card.querySelector('.clip-number').textContent = index + 1;
            });
        }

        function generateEmail() {
            const intro = document.getElementById('introText').value;
            const cards = document.querySelectorAll('.clip-card');
            
            let emailText = `Hello,\n\n${intro}\n\n`;

            cards.forEach((card, index) => {
                const clipNum = index + 1;
                const desc = card.querySelector('.clip-desc').value.trim();
                const url = card.querySelector('.clip-url').value.trim();
                const hed = card.querySelector('.clip-hed').value.trim();
                const dek = card.querySelector('.clip-dek').value.trim();

                emailText += `Clip ${clipNum} ${desc}\n\n`;
                emailText += `SOCIAL CLIP: ${url}\n\n`;
                emailText += `HED: ${hed}\n`;
                emailText += `DEK: ${dek}\n\n`;
                
                // Add separator spacing between clips except after the last one
                if (index < cards.length - 1) {
                    emailText += `\n`;
                }
            });

            emailText += `Thank you!`;

            document.getElementById('output').textContent = emailText;
            document.getElementById('outputSection').style.display = 'block';
            document.getElementById('outputSection').scrollIntoView({ behavior: 'smooth' });
        }

        function copyToClipboard() {
            const text = document.getElementById('output').textContent;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>

</body>
</html>
